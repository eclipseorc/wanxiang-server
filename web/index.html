<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>万象设备管理</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e8f0;--accent:#3157d5;--green:#14804a;--red:#bd3030;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#172554;color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}header h1{font-size:20px;margin:0}main{max-width:1280px;margin:24px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:0 2px 8px #1725540a}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}h2{font-size:17px;margin:0 0 14px}label{display:block;color:var(--muted);font-size:13px;margin:5px 0}input,select{border:1px solid #cbd2df;border-radius:7px;padding:9px 10px;font:inherit;min-width:130px}button{border:0;border-radius:7px;background:var(--accent);color:white;padding:9px 13px;font:inherit;cursor:pointer}button.secondary{background:#e8ecf5;color:#27334d}button.danger{background:#b42318}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:var(--muted)}.status{font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#98a2b3}.dot.online{background:#12a05c}.dot.offline{background:#98a2b3}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:13px;color:var(--muted);font-weight:600}.scroll{overflow:auto}video{width:min(100%,800px);max-height:70vh;background:#101522;border-radius:8px}.hidden{display:none}.notice{padding:10px;border-radius:7px;background:#fef3c7;color:#714f00}.toast{position:fixed;right:18px;bottom:18px;padding:12px 16px;background:#172554;color:#fff;border-radius:8px;display:none;max-width:420px;z-index:5}.token{font-family:monospace;word-break:break-all}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px}@media(max-width:640px){header{padding:14px}main{margin:14px auto}.card{padding:14px}th,td{padding:8px 6px}}
</style>
</head>
<body>
<header><h1>万象设备管理</h1><div class="row"><span id="connStatus" class="status">未连接</span><button id="logoutBtn" class="secondary hidden">退出登录</button></div></header>
<main>
<section id="loginCard" class="card"><h2>管理员登录</h2><form id="loginForm" class="row"><label>用户名<br><input id="username" autocomplete="username" required></label><label>密码<br><input id="password" type="password" autocomplete="current-password" required></label><button>登录</button><span class="muted small">首次启动使用服务端配置的管理员账号</span></form></section>
<div id="app" class="hidden">
<section class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin-bottom:3px">设备</h2><span id="summary" class="muted small">正在加载…</span></div><div class="row"><button id="refreshBtn" class="secondary">刷新</button><button id="connectBtn">连接实时事件</button></div></div><div class="scroll"><table><thead><tr><th>状态</th><th>设备</th><th>电量</th><th>RTT</th><th>分组</th><th>最后在线</th><th>操作</th></tr></thead><tbody id="deviceRows"><tr><td colspan="7" class="muted">暂无设备</td></tr></tbody></table></div></section>
<section class="grid">
<div class="card"><h2>创建设备</h2><form id="deviceForm" class="row"><input id="deviceName" placeholder="设备名称" required><button>创建</button></form><div id="newDeviceToken" class="small"></div></div>
<div class="card"><h2>创建用户</h2><form id="userForm" class="row"><input id="newUsername" placeholder="用户名" required><input id="newPassword" type="password" placeholder="至少 12 位密码" minlength="12" required><button>创建</button></form><div id="newUserResult" class="small muted"></div></div>
<div class="card"><h2>设备组</h2><form id="groupForm" class="row"><input id="groupName" placeholder="新组名称" required><button>创建组</button></form><div id="groupList" class="small muted" style="margin-top:10px">加载中…</div></div>
</section>
<section class="card"><h2>分组与权限</h2><div class="grid">
<form id="userGroupForm"><label>把用户加入用户组</label><input id="ugUserId" placeholder="用户 ID" required><select id="ugGroup" required></select><button>分配用户组</button></form>
<form id="deviceGroupForm"><label>把设备加入设备组</label><select id="dgDevice" required></select><select id="dgGroup" required></select><button>分配设备组</button></form>
<form id="accessForm"><label>用户组访问设备组</label><select id="accessUG" required></select><select id="accessDG" required></select><label><input id="canView" type="checkbox" checked> 允许查看</label><label><input id="canManage" type="checkbox"> 允许管理设备</label><button>保存权限</button></form>
</div><p class="muted small">用户组与设备组可同名但应作为独立授权关系管理；普通用户只有获得组间权限后才能看到对应设备。管理员拥有全部权限。</p></section>
<section id="watchCard" class="card hidden"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">屏幕查看</h2><span id="watchInfo" class="muted small"></span></div><button id="stopWatchBtn" class="danger">停止查看</button></div><p id="watchNotice" class="notice">等待设备端用户确认系统屏幕共享授权。未经确认不会采集屏幕。</p><video id="screen" autoplay playsinline controls></video></section>
</div>
</main><div id="toast" class="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('adminToken')||'';let user=null,ws=null,wsTicketBusy=false;let devices=[];let groups=[];let pc=null;let currentWatch='';let candidates=[];let reconnectTimer=null;
const apiBase=location.origin;const wsBase=localStorage.getItem('wsBase')||`${location.protocol==='https:'?'wss:':'ws:'}//${location.hostname}:8081`;
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',3600)}
async function api(path,options={}){const headers=new Headers(options.headers||{});if(token)headers.set('Authorization',`Bearer ${token}`);if(options.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');const res=await fetch(apiBase+path,{...options,headers});let data=null;const text=await res.text();if(text){try{data=JSON.parse(text)}catch{data={error:text}}}if(!res.ok)throw new Error(data?.error||`HTTP ${res.status}`);return data}
function showApp(){const yes=!!token;$('loginCard').classList.toggle('hidden',yes);$('app').classList.toggle('hidden',!yes);$('logoutBtn').classList.toggle('hidden',!yes);if(yes){loadAll();connectRealtime()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=data.token;user=data;sessionStorage.setItem('adminToken',token);showApp();toast('登录成功')}catch(err){toast(err.message)}});
$('logoutBtn').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{};token='';sessionStorage.removeItem('adminToken');if(ws)ws.close();showApp()};
$('refreshBtn').onclick=loadAll;$('connectBtn').onclick=connectRealtime;
async function loadAll(){try{const [ds,gs]=await Promise.all([api('/api/admin/devices'),api('/api/admin/groups')]);devices=ds||[];groups=gs||[];renderDevices();renderGroups()}catch(e){toast(e.message);if(/unauthorized/i.test(e.message))logoutLocal()}}
function logoutLocal(){token='';sessionStorage.removeItem('adminToken');if(ws)ws.close();showApp()}
function renderDevices(){const body=$('deviceRows');body.replaceChildren();if(!devices.length){body.innerHTML='<tr><td colspan="7" class="muted">没有可见设备</td></tr>';$('summary').textContent='0 台设备';fillDeviceSelect();return}let online=0;for(const d of devices){if(d.online)online++;const tr=document.createElement('tr');const state=document.createElement('td');state.innerHTML=`<span class="dot ${d.online?'online':'offline'}"></span>${d.online?'在线':'离线'}${d.enabled?'':' / 已停用'}`;const name=document.createElement('td');name.textContent=d.name;const battery=document.createElement('td');battery.textContent=d.online?`${d.battery}%`:'—';const rtt=document.createElement('td');rtt.textContent=d.online?`${d.rttMs} ms`:'—';const group=document.createElement('td');group.textContent=(d.groupIds||[]).map(id=>groups.find(g=>g.id===id)?.name||id).join(', ')||'—';const last=document.createElement('td');last.textContent=d.lastSeen?new Date(d.lastSeen*1000).toLocaleString():'—';const actions=document.createElement('td');const box=document.createElement('div');box.className='actions';const watch=document.createElement('button');watch.textContent='查看屏幕';watch.disabled=!d.online||!d.enabled;watch.onclick=()=>startWatch(d.id,d.name);box.append(watch);if(user?.role==='admin'||user?.role==='user'){const toggle=document.createElement('button');toggle.className=d.enabled?'danger':'secondary';toggle.textContent=d.enabled?'断开/停用':'启用';toggle.onclick=()=>deviceAction(d.id,d.enabled?'disconnect':'enable');box.append(toggle)}actions.append(box);tr.append(state,name,battery,rtt,group,last,actions);body.append(tr)}$('summary').textContent=`${devices.length} 台设备，${online} 台在线${ws?.readyState===WebSocket.OPEN?' · 实时更新中':' · 实时连接未连接'}`;fillDeviceSelect()}
function fillDeviceSelect(){const s=$('dgDevice');const old=s.value;s.replaceChildren();for(const d of devices){const o=document.createElement('option');o.value=d.id;o.textContent=`${d.name} (${d.id.slice(0,8)})`;s.append(o)}if([...s.options].some(o=>o.value===old))s.value=old}
function renderGroups(){const labels=groups.map(g=>`${g.name} (${g.id.slice(0,8)})`);$('groupList').textContent=groups.length?labels.join(' · '):'暂无设备组';for(const id of ['ugGroup','dgGroup','accessUG','accessDG']){const el=$(id),old=el.value;el.replaceChildren();for(const g of groups){const o=document.createElement('option');o.value=g.id;o.textContent=g.name;el.append(o)}if([...el.options].some(o=>o.value===old))el.value=old}}
async function connectRealtime(){if(ws&&ws.readyState===WebSocket.OPEN){toast('实时事件已连接');return}if(wsTicketBusy)return;wsTicketBusy=true;try{const {ticket}=await api('/api/admin/ws-ticket',{method:'POST'});const sock=new WebSocket(`${wsBase}/ws/admin?ticket=${encodeURIComponent(ticket)}`);ws=sock;$('connStatus').textContent='正在连接实时事件…';sock.onopen=()=>{$('connStatus').textContent='实时事件已连接';$('connectBtn').textContent='实时已连接';loadAll()};sock.onmessage=event=>handleServerMessage(JSON.parse(event.data));sock.onclose=()=>{$('connStatus').textContent='实时连接已断开';$('connectBtn').textContent='重新连接';if(currentWatch)cleanupWatch(false);clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{if(token)connectRealtime()},4000)};sock.onerror=()=>{$('connStatus').textContent='实时连接失败；检查 WS 地址/Origin'};}catch(e){toast(`WebSocket ticket 获取失败：${e.message}`)}finally{wsTicketBusy=false}}
function sendWS(msg){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(msg));else toast('管理端实时连接尚未建立')}
async function handleServerMessage(m){if(m.type==='device-list'){devices=m.devices||[];renderDevices();return}if(m.type==='device-online'||m.type==='device-offline'||m.type==='device-state'||m.type==='device-admin-state'){const d=devices.find(x=>x.id===m.deviceId);if(d){if(m.type==='device-online')d.online=true;if(m.type==='device-offline')d.online=false;if(m.type==='device-admin-state'&&m.data?.state==='disconnect'){d.enabled=false;d.online=false}if(m.type==='device-admin-state'&&m.data?.state==='enable')d.enabled=true;if(m.type==='device-state'&&m.data){d.battery=m.data.battery??d.battery;d.rttMs=m.data.rttMs??d.rttMs;d.status=m.data.status??d.status;d.lastSeen=m.data.lastSeen??d.lastSeen}renderDevices()}else loadAll();return}if(m.type==='watch-started'){currentWatch=m.sessionId;$('watchCard').classList.remove('hidden');$('watchInfo').textContent=`会话 ${m.sessionId} · 设备 ${m.deviceId}`;$('watchNotice').textContent='已请求设备端开始共享；等待设备使用者确认系统授权…';return}if(m.type==='watch-ready'){$('watchNotice').textContent='设备已授权，正在建立视频连接…';return}if(m.type==='watch-denied'){$('watchNotice').textContent='设备使用者拒绝了屏幕共享请求。';toast('设备拒绝共享');return}if(m.type==='offer'){await acceptOffer(m);return}if(m.type==='candidate'){await addCandidate(m);return}if(m.type==='watch-ended'||m.type==='watch-stopped'){cleanupWatch(false);toast('屏幕查看已结束');return}if(m.type==='error'){toast(m.message||'服务器返��错误');return}if(m.type==='device-online'||m.type==='device-offline')loadAll()}
async function startWatch(id,name){if(!ws||ws.readyState!==WebSocket.OPEN){await connectRealtime();if(!ws||ws.readyState!==WebSocket.OPEN){toast('实时连接未就绪');return}}if(currentWatch)stopWatch();$('watchCard').classList.remove('hidden');$('watchInfo').textContent=`设备：${name}`;$('watchNotice').textContent='正在请求设备端授权…';sendWS({type:'watch',deviceId:id})}
async function acceptOffer(m){try{if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ontrack=e=>{$('screen').srcObject=e.streams[0];$('watchNotice').textContent='屏幕共享已连接。'};pc.onicecandidate=e=>{if(e.candidate)sendWS({type:'candidate',sessionId:currentWatch,candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex})};await pc.setRemoteDescription({type:'offer',sdp:m.sdp});for(const c of candidates)await pc.addIceCandidate(c);candidates=[];const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sendWS({type:'answer',sessionId:m.sessionId||currentWatch,sdp:answer.sdp})}catch(e){toast(`建立屏幕连接失败：${e.message}`)}}
async function addCandidate(m){const c={candidate:m.candidate,sdpMid:m.sdpMid,sdpMLineIndex:m.sdpMLineIndex};if(pc?.remoteDescription){try{await pc.addIceCandidate(c)}catch(e){console.warn('ICE candidate rejected',e)}}else candidates.push(c)}
function stopWatch(){if(currentWatch)sendWS({type:'watch-stop',sessionId:currentWatch});cleanupWatch(false)}function cleanupWatch(hide=true){if(pc){pc.close();pc=null}candidates=[];$('screen').srcObject=null;currentWatch='';if(hide)$('watchCard').classList.add('hidden');else if(!$('watchCard').classList.contains('hidden'))$('watchNotice').textContent='会话已结束。'}$('stopWatchBtn').onclick=stopWatch;
async function deviceAction(id,action){if(!confirm(action==='disconnect'?'确定停用并断开此设备？':'确定重新启用此设备？'))return;try{await api(`/api/admin/devices/${action}`,{method:'POST',body:JSON.stringify({deviceId:id})});toast(action==='disconnect'?'断开操作已提交':'启用操作已提交');setTimeout(loadAll,600)}catch(e){toast(e.message)}}
$('deviceForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/admin/devices',{method:'POST',body:JSON.stringify({name:$('deviceName').value.trim()})});$('newDeviceToken').innerHTML='设备已创建。请立即安全保存以下凭据（令牌仅显示一次）：<div class="token">ID: '+escapeHTML(d.deviceId)+'<br>Token: '+escapeHTML(d.deviceToken)+'</div>';$('deviceName').value='';toast('设备创建成功');loadAll()}catch(err){toast(err.message)}});
$('userForm').addEventListener('submit',async e=>{e.preventDefault();try{const x=await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:$('newUsername').value.trim(),password:$('newPassword').value})});$('newUserResult').textContent=`用户已创建，ID：${x.userId}（可复制到用户组分配表单）`;$('ugUserId').value=x.userId;$('newUsername').value='';$('newPassword').value='';toast('用户创建成功')}catch(err){toast(err.message)}});
$('groupForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/groups',{method:'POST',body:JSON.stringify({name:$('groupName').value.trim()})});$('groupName').value='';await loadAll();toast('设备组已创建')}catch(err){toast(err.message)}});
$('userGroupForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/groups/users',{method:'POST',body:JSON.stringify({userId:$('ugUserId').value.trim(),groupId:$('ugGroup').value})});toast('用户组分配成功')}catch(err){toast(err.message)}});
$('deviceGroupForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/groups/devices',{method:'POST',body:JSON.stringify({deviceId:$('dgDevice').value,groupId:$('dgGroup').value})});await loadAll();toast('设备组分配成功')}catch(err){toast(err.message)}});
$('accessForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/group-access',{method:'POST',body:JSON.stringify({userGroupId:$('accessUG').value,deviceGroupId:$('accessDG').value,canView:$('canView').checked,canManage:$('canManage').checked})});toast('组权限已保存')}catch(err){toast(err.message)}});
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(token)showApp();
</script>
</body>
</html>
